name: CI

on:
  pull_request:
  push:
    branches: [production]

# A newer push to the same PR makes the in-flight run irrelevant.
concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

permissions:
  contents: read

env:
  NODE_VERSION: 24

jobs:
  checks:
    name: Types and bundle
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      # Reads the pnpm version from the packageManager field in package.json.
      - uses: pnpm/action-setup@v4
        with:
          run_install: false

      - uses: actions/setup-node@v5
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      # Both gates report in a single run. A failed step still fails the job.
      - name: Typecheck
        if: ${{ !cancelled() }}
        run: pnpm typecheck

      # A dry run bundles the Worker without deploying and needs no credentials.
      - name: Bundle
        if: ${{ !cancelled() }}
        run: pnpm check:bundle
